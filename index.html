<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Portugués de Portugal B1 - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-10 px-4 text-slate-800">

<div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl p-6 md:p-10 border border-slate-100">

    <!-- Cabecera -->
    <header class="mb-8 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                Traductor Portugués 🇵🇹 <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full uppercase">Pt. de Portugal</span>
            </h1>
            <p class="text-sm text-slate-500 mt-1">
                Traducción inteligente · Pronunciación lusa · Análisis gramatical
            </p>
        </div>
    </header>

    <!-- Dirección -->
    <div class="mb-5">
        <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-2">
            Dirección de traducción:
        </label>
        <select id="direccion" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <option value="es-pt">Español ➔ Portugués (Portugal)</option>
            <option value="pt-es">Portugués (Portugal) ➔ Español</option>
        </select>
    </div>

    <!-- Texto de entrada -->
    <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
            <label for="texto" class="text-sm font-semibold text-slate-700">
                Texto o frase:
            </label>
            <button onclick="iniciarVoz()" id="btnMicrofono" class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm">
                🎙️ Dictar por voz
            </button>
        </div>
        <div class="relative">
            <textarea id="texto" rows="4" maxlength="300" placeholder="Escribe o dicta cualquier palabra o frase..." oninput="actualizarContador()" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition text-sm"></textarea>
            <span id="contadorCaracteres" class="absolute bottom-3 right-3 text-xs text-slate-400">0/300</span>
        </div>
    </div>

    <!-- Botón Traducir -->
    <button id="btnTraducir" onclick="traducir()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2">
        <span>Traducir y Analizar</span>
    </button>

    <!-- Cargando -->
    <div id="loading" class="hidden text-center my-6 text-slate-500 animate-pulse font-medium text-sm">
        Traduciendo al instante...
    </div>

    <!-- Resultado -->
    <div id="resultado" class="hidden mt-8 border-t pt-6 space-y-6">
        
        <!-- Bloque Traducción -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Traducción obtenida:
                </h2>
                <button onclick="copiarTraduccion()" class="text-xs text-emerald-600 hover:text-emerald-800 font-medium flex items-center gap-1">
                    📋 Copiar texto
                </button>
            </div>
            <div id="traduccion" class="text-xl font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-inner"></div>
        </div>

        <!-- Bloque Audio / Pronunciación -->
        <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-5 shadow-sm">
            <h2 class="font-bold text-emerald-900 mb-3 flex items-center gap-2 text-sm">
                🔊 Pronunciación Interactiva (PT-PT)
            </h2>

            <div class="flex gap-2 flex-wrap items-center">
                <button onclick="reproducirAudio()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md shadow-emerald-600/20">
                    ▶️ Reproducir
                </button>
                <button onclick="detenerAudio()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                    ⏹️ Detener
                </button>

                <div class="ml-auto flex items-center gap-2">
                    <label class="text-xs font-semibold text-emerald-800">Velocidad:</label>
                    <select id="velocidad" class="px-2.5 py-1.5 border border-emerald-300 rounded-xl text-xs bg-white text-emerald-900 font-medium focus:outline-none">
                        <option value="0.7">0.7x (Lenta)</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.9" selected>0.9x (Normal)</option>
                        <option value="1">1.0x (Rápida)</option>
                    </select>
                </div>
            </div>

            <div id="estadoAudio" class="text-xs text-emerald-700 mt-3 font-medium">
                Listo para reproducir
            </div>
        </div>

        <!-- Bloque Gramática / Uso Luso -->
        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                Orientación y particularidades (PT-PT)
            </h2>
            <div id="gramatica" class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 text-sm text-slate-700 leading-relaxed shadow-sm"></div>
        </div>

    </div>

    <!-- Historial de Traducciones Recientes -->
    <div id="historialContainer" class="hidden mt-10 pt-6 border-t border-slate-200">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Historial reciente:</h3>
        <div id="listaHistorial" class="space-y-2"></div>
    </div>

</div>

<script>
let voces = [];
let textoParaAudio = "";
let idiomaAudio = "pt-PT";
let historial = [];

function cargarVoces() {
    if (!("speechSynthesis" in window)) return;
    voces = window.speechSynthesis.getVoices();
}

cargarVoces();
if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function buscarVoz(idioma) {
    if (!voces.length) voces = window.speechSynthesis.getVoices();
    // Priorizamos estrictamente voces de Portugal (pt-pt)
    let voz = voces.find(v => v.lang.toLowerCase() === "pt-pt");
    if (voz) return voz;
    // Si no encuentra exacto pt-pt, busca alguna que empiece por pt pero priorizando Portugal si existe en el nombre
    return voces.find(v => v.lang.toLowerCase().startsWith("pt") && v.name.toLowerCase().includes("portugal")) || voces.find(v => v.lang.toLowerCase().startsWith("pt")) || null;
}

function actualizarContador() {
    const texto = document.getElementById("texto").value;
    document.getElementById("contadorCaracteres").innerText = `${texto.length}/300`;
}

async function traducir() {
    const textoOriginal = document.getElementById("texto").value.trim();
    
    const textoLimpio = textoOriginal.replace(/[¿?¡!.,]/g, '').trim();
    const textoParaDiccionario = textoLimpio.toLowerCase();
    
    const direccion = document.getElementById("direccion").value;

    if (!textoOriginal) {
        alert("Por favor, escribe una palabra o frase para traducir.");
        return;
    }

    const loading = document.getElementById("loading");
    const resultado = document.getElementById("resultado");
    const boton = document.getElementById("btnTraducir");

    loading.classList.remove("hidden");
    resultado.classList.add("hidden");
    boton.disabled = true;

    detenerAudio();

    // 1. Sistema de caché local
    const cacheKey = `traduccion_${direccion}_${textoOriginal}`;
    const traduccionGuardada = localStorage.getItem(cacheKey);

    if (traduccionGuardada) {
        const traduccion = traduccionGuardada;
        textoParaAudio = traduccion;
        document.getElementById("traduccion").innerText = traduccion;
        document.getElementById("gramatica").innerHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Análisis PT-PT (Caché local):</strong>
            <p>Traducción recuperada instantáneamente sin consumir solicitudes adicionales.</p>
        `;
        loading.classList.add("hidden");
        resultado.classList.remove("hidden");
        boton.disabled = false;
        agregarAlHistorial(textoOriginal, traduccion);
        return;
    }

    // Diccionario local estricto enfocado en diferencias clave de Portugal vs Brasil
    const diccionarioPTExacto = {
        "buenos dias": "Bom dia",
        "buenos días": "Bom dia",
        "buenas tardes": "Boa tarde",
        "buenas noches": "Boa noite",
        "hola": "Olá",
        "autobus": "Autocarro",
        "autobús": "Autocarro",
        "coche": "Carro",
        "zumo": "Sumo",
        "camarero": "Empregado de mesa",
        "ordenador": "Computador",
        "fresa": "Morango"
    };

    if (direccion === 'es-pt' && diccionarioPTExacto[textoParaDiccionario]) {
        const traduccion = diccionarioPTExacto[textoParaDiccionario];
        textoParaAudio = traduccion;
        document.getElementById("traduccion").innerText = traduccion;
        document.getElementById("gramatica").innerHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Nota de Portugués de Portugal:</strong>
            <p>Término verificado específicamente para el uso cotidiano en Portugal (excluyendo variantes de Brasil).</p>
        `;
        localStorage.setItem(cacheKey, traduccion);
        loading.classList.add("hidden");
        resultado.classList.remove("hidden");
        boton.disabled = false;
        agregarAlHistorial(textoOriginal, traduccion);
        return;
    }

    // 2. Uso de Google Translate (Forzando portugués de Portugal 'pt')
    const langFrom = direccion === "es-pt" ? "es" : "pt";
    const langTo = direccion === "es-pt" ? "pt" : "es";
    idiomaAudio = "pt-PT";

    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${langFrom}&tl=${langTo}&dt=t&q=${encodeURIComponent(textoOriginal)}`;

    try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No se pudo conectar con el servicio de traducción.");

        const datos = await respuesta.json();
        if (!datos || !datos[0]) {
            throw new Error("No se encontró una traducción válida.");
        }

        const traduccion = datos[0].map(segmento => segmento[0]).join('');
        textoParaAudio = traduccion;

        localStorage.setItem(cacheKey, traduccion);

        document.getElementById("traduccion").innerText = traduccion;

        document.getElementById("gramatica").innerHTML = direccion === "es-pt"
            ? `
                <strong class="text-emerald-900 block mb-1">💡 Particularidades del Portugués de Portugal:</strong>
                <ul class="list-disc ml-5 space-y-1">
                    <li>Se utiliza la forma formal/informal según el contexto (distinción estricta entre <em>tu</em> y <em>você</em> / <em>o senhor</em>).</li>
                    <li>Las vocales átonas suelen cerrarse notablemente en la pronunciación lusa.</li>
                    <li>Presta atención al uso de las contracciones de preposiciones con artículos (ej. <em>em + o = no</em>).</li>
                </ul>
              `
            : `
                <strong class="text-emerald-900 block mb-1">💡 Análisis del texto en Portugués de Portugal:</strong>
                <ul class="list-disc ml-5 space-y-1">
                    <li>Revisa la colocación de los pronombres átonos (clíticos), que en Portugal tienden a ir antes del verbo (proclisis) en más contextos que en Brasil.</li>
                    <li>Verifica el vocabulario autóctono europeo frente al brasileño.</li>
                </ul>
              `;

        resultado.classList.remove("hidden");
        agregarAlHistorial(textoOriginal, traduccion);

    } catch (error) {
        console.error(error);
        alert("Error al traducir: " + error.message);
    } finally {
        loading.classList.add("hidden");
        boton.disabled = false;
    }
}

function reproducirAudio() {
    if (!textoParaAudio) {
        alert("Primero realiza una traducción.");
        return;
    }
    if (!("speechSynthesis" in window)) {
        alert("Tu navegador no soporta síntesis de voz.");
        return;
    }

    window.speechSynthesis.cancel();

    const velocidad = parseFloat(document.getElementById("velocidad").value);
    const estado = document.getElementById("estadoAudio");
    const mensaje = new SpeechSynthesisUtterance(textoParaAudio);

    mensaje.lang = idiomaAudio;
    mensaje.rate = velocidad;
    mensaje.volume = 1;
    mensaje.pitch = 1;

    const voz = buscarVoz(idiomaAudio);
    if (voz) {
        mensaje.voice = voz;
        estado.innerText = `🔊 Reproduciendo con voz lusa (${voz.name})`;
    } else {
        estado.innerText = "🔊 Reproduciendo audio...";
    }

    mensaje.onend = () => { estado.innerText = "✓ Audio finalizado con éxito"; };
    mensaje.onerror = () => { estado.innerText = "⚠️ Error al reproducir audio"; };

    window.speechSynthesis.speak(mensaje);
}

function detenerAudio() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    const estado = document.getElementById("estadoAudio");
    if (estado) estado.innerText = "Audio detenido";
}

function copiarTraduccion() {
    const texto = document.getElementById("traduccion").innerText;
    navigator.clipboard.writeText(texto).then(() => {
        alert("¡Traducción copiada al portapapeles!");
    });
}

function agregarAlHistorial(orig, trad) {
    historial.unshift({ orig, trad });
    if (historial.length > 3) historial.pop();

    const contenedor = document.getElementById("historialContainer");
    const lista = document.getElementById("listaHistorial");
    lista.innerHTML = "";

    historial.forEach(item => {
        const div = document.createElement("div");
        div.className = "text-xs bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex justify-between items-center";
        div.innerHTML = `<span class="truncate max-w-[180px] font-medium"><strong>${item.orig}</strong></span> <span class="text-slate-400">➔</span> <span class="truncate max-w-[180px] text-emerald-700 font-semibold">${item.trad}</span>`;
        lista.appendChild(div);
    });

    contenedor.classList.remove("hidden");
}

function iniciarVoz() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("El reconocimiento de voz no está disponible en este navegador. Utiliza Google Chrome o Microsoft Edge.");
        return;
    }

    const reconocimiento = new SpeechRecognition();
    const direccion = document.getElementById("direccion").value;
    // Forzamos explícitamente pt-PT para Portugal en el reconocimiento por voz
    reconocimiento.lang = direccion === "es-pt" ? "es-ES" : "pt-PT";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    const boton = document.getElementById("btnMicrofono");
    boton.innerText = "🎙️ Escuchando...";
    boton.classList.add("bg-rose-100");

    reconocimiento.onresult = (event) => {
        document.getElementById("texto").value = event.results[0][0].transcript;
        actualizarContador();
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    reconocimiento.onerror = () => {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    reconocimiento.onend = () => {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    try {
        reconocimiento.start();
    } catch (e) {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    }
}
</script>

</body>
</html>
