<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Portugués de Portugal B1 - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-10 px-4 text-slate-800">

<!-- Contenedor de toasts -->
<div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2" role="status" aria-live="polite"></div>

<div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl p-6 md:p-10 border border-slate-100">

    <header class="mb-8 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                Traductor Portugués 🇵🇹 <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full uppercase">Pt. de Portugal</span>
            </h1>
            <p class="text-sm text-slate-500 mt-1">
                Traducción inteligente · Pronunciación lusa · Análisis gramatical
            </p>
        </div>
    </header>

    <div class="mb-5">
        <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-2">
            Dirección de traducción:
        </label>
        <select id="direccion" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <option value="es-pt">Español ➔ Portugués (Portugal)</option>
            <option value="pt-es">Portugués (Portugal) ➔ Español</option>
        </select>
    </div>

    <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
            <label for="texto" class="text-sm font-semibold text-slate-700">
                Texto o frase:
            </label>
            <button onclick="iniciarVoz()" id="btnMicrofono"
                    aria-label="Dictar texto por voz"
                    class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm">
                🎙️ Dictar por voz
            </button>
        </div>
        <div class="relative">
            <textarea id="texto" rows="4" maxlength="300"
                      placeholder="Escribe o dicta cualquier palabra o frase... (Ctrl+Enter para traducir)"
                      oninput="actualizarContadorDebounced()"
                      class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition text-sm"></textarea>
            <span id="contadorCaracteres" class="absolute bottom-3 right-3 text-xs text-slate-400">0/300</span>
        </div>
    </div>

    <button id="btnTraducir" onclick="traducir()"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
        <span>Traducir y Analizar</span>
    </button>

    <div id="loading" class="hidden text-center my-6 text-slate-500 animate-pulse font-medium text-sm" aria-live="polite">
        Traduciendo al instante...
    </div>

    <div id="resultado" class="hidden mt-8 border-t pt-6 space-y-6">

        <div>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Traducción obtenida:</h2>
                <button onclick="copiarTraduccion(this)"
                        class="text-xs text-emerald-600 hover:text-emerald-800 font-medium flex items-center gap-1 transition">
                    📋 Copiar texto
                </button>
            </div>
            <div id="traduccion" class="text-xl font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-inner"></div>
        </div>

        <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-5 shadow-sm">
            <h2 class="font-bold text-emerald-900 mb-3 flex items-center gap-2 text-sm">
                🔊 Pronunciación Interactiva (PT-PT)
            </h2>

            <div class="flex gap-2 flex-wrap items-center">
                <button onclick="reproducirAudio()"
                        aria-label="Reproducir audio de la traducción"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md shadow-emerald-600/20">
                    ▶️ Reproducir
                </button>
                <button onclick="detenerAudio()"
                        aria-label="Detener audio"
                        class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                    ⏹️ Detener
                </button>

                <div class="ml-auto flex items-center gap-2">
                    <label for="velocidad" class="text-xs font-semibold text-emerald-800">Velocidad:</label>
                    <select id="velocidad" class="px-2.5 py-1.5 border border-emerald-300 rounded-xl text-xs bg-white text-emerald-900 font-medium focus:outline-none">
                        <option value="0.7">0.7x (Lenta)</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.9" selected>0.9x (Normal)</option>
                        <option value="1">1.0x (Rápida)</option>
                    </select>
                </div>
            </div>

            <div id="estadoAudio" class="text-xs text-emerald-700 mt-3 font-medium" aria-live="polite">
                Listo para reproducir
            </div>
        </div>

        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                Orientación y particularidades (PT-PT)
            </h2>
            <div id="gramatica" class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 text-sm text-slate-700 leading-relaxed shadow-sm"></div>
        </div>

    </div>

    <div id="historialContainer" class="hidden mt-10 pt-6 border-t border-slate-200">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Historial reciente:</h3>
            <button onclick="limpiarHistorial()" class="text-xs text-slate-400 hover:text-rose-600 transition">🗑️ Borrar</button>
        </div>
        <div id="listaHistorial" class="space-y-2"></div>
    </div>

</div>

<script>
/* =========================================================
   CONSTANTES Y ESTADO
   ========================================================= */
const MAX_CARACTERES = 300;
const MAX_HISTORIAL = 10;
const CACHE_PREFIX = 'traduccion_';
const HISTORIAL_KEY = 'traductor_historial_pt';
const IDIOMA_AUDIO = 'pt-PT';

let voces = [];
let textoParaAudio = '';
let historial = [];

/* Diccionario local ES → PT-PT (ampliado) */
const DICCIONARIO_ES_PT = {
    'hola': 'Olá',
    'buenos dias': 'Bom dia',
    'buenas tardes': 'Boa tarde',
    'buenas noches': 'Boa noite',
    'adios': 'Adeus',
    'hasta luego': 'Até logo',
    'por favor': 'Por favor',
    'gracias': 'Obrigado',
    'de nada': 'De nada',
    'perdon': 'Desculpe',
    'autobus': 'Autocarro',
    'coche': 'Carro',
    'zumo': 'Sumo',
    'camarero': 'Empregado de mesa',
    'ordenador': 'Computador',
    'fresa': 'Morango',
    'movil': 'Telemóvel',
    'nevera': 'Frigorífico',
    'mantequilla': 'Manteiga',
    'helado': 'Gelado',
    'pasteleria': 'Pastelaria',
    'billete': 'Bilhete',
    'tren': 'Comboio',
    'habitacion': 'Quarto',
    'cama': 'Cama',
    'desayuno': 'Pequeno-almoço',
    'comida': 'Comida',
    'cena': 'Jantar',
    'agua': 'Água',
    'vino': 'Vinho',
    'cerveza': 'Cerveja',
    'cuenta': 'Conta',
    'dinero': 'Dinheiro',
    'tienda': 'Loja',
    'supermercado': 'Supermercado',
    'playa': 'Praia',
    'ciudad': 'Cidade',
    'pueblo': 'Vila',
    'calle': 'Rua',
    'plaza': 'Praça',
    'iglesia': 'Igreja',
    'hospital': 'Hospital',
    'medico': 'Médico',
    'farmacia': 'Farmácia',
    'trabajo': 'Trabalho',
    'casa': 'Casa',
    'familia': 'Família',
    'amigo': 'Amigo',
    'tiempo': 'Tempo',
    'hoy': 'Hoje',
    'mañana': 'Amanhã',
    'ayer': 'Ontem'
};

/* =========================================================
   UTILIDADES
   ========================================================= */
function normalizar(texto) {
    return texto
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')  // quita tildes
        .replace(/[¿?¡!.,;:]/g, '')
        .trim();
}

function debounce(fn, delay = 150) {
    let t;
    return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

function mostrarToast(mensaje, tipo = 'info') {
    const colores = {
        info:    'bg-slate-800 text-white',
        exito:   'bg-emerald-600 text-white',
        error:   'bg-rose-600 text-white',
        aviso:   'bg-amber-500 text-white'
    };
    const cont = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `${colores[tipo]} px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 translate-x-full opacity-0`;
    toast.textContent = mensaje;
    cont.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full', 'opacity-0');
    });

    setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
    }, 2600);
}

/* =========================================================
   CONTADOR DE CARACTERES
   ========================================================= */
function actualizarContador() {
    const texto = document.getElementById('texto').value;
    const cont = document.getElementById('contadorCaracteres');
    cont.innerText = `${texto.length}/${MAX_CARACTERES}`;
    cont.classList.toggle('text-rose-500', texto.length > MAX_CARACTERES * 0.9);
}
const actualizarContadorDebounced = debounce(actualizarContador, 100);

/* =========================================================
   VOCES
   ========================================================= */
function cargarVoces() {
    if (!('speechSynthesis' in window)) return;
    voces = window.speechSynthesis.getVoices();
}
cargarVoces();
if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function buscarVoz(idioma) {
    if (!voces.length && 'speechSynthesis' in window) {
        voces = window.speechSynthesis.getVoices();
    }
    const lang = idioma.toLowerCase();
    // 1. Coincidencia exacta pt-PT
    let voz = voces.find(v => v.lang.toLowerCase() === lang);
    if (voz) return voz;
    // 2. pt-PT con nombre "Portugal"
    voz = voces.find(v => v.lang.toLowerCase().startsWith('pt') && v.name.toLowerCase().includes('portugal'));
    if (voz) return voz;
    // 3. Cualquier pt-*
    voz = voces.find(v => v.lang.toLowerCase().startsWith('pt'));
    if (voz) return voz;
    // 4. Fallback: la primera voz disponible
    return voces[0] || null;
}

/* =========================================================
   TRADUCCIÓN
   ========================================================= */
async function traducir() {
    const textoOriginal = document.getElementById('texto').value.trim();
    const direccion = document.getElementById('direccion').value;

    if (!textoOriginal) {
        mostrarToast('Escribe una palabra o frase para traducir.', 'aviso');
        return;
    }

    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');
    const boton = document.getElementById('btnTraducir');

    loading.classList.remove('hidden');
    resultado.classList.add('hidden');
    boton.disabled = true;

    detenerAudio();

    const cacheKey = `${CACHE_PREFIX}${direccion}_${textoOriginal}`;
    const traduccionGuardada = localStorage.getItem(cacheKey);

    // 1. Caché
    if (traduccionGuardada) {
        mostrarResultado(traduccionGuardada, {
            origen: 'caché',
            direccion
        });
        loading.classList.add('hidden');
        boton.disabled = false;
        agregarAlHistorial(textoOriginal, traduccionGuardada);
        return;
    }

    // 2. Diccionario local (solo ES → PT)
    const claveDic = normalizar(textoOriginal);
    if (direccion === 'es-pt' && DICCIONARIO_ES_PT[claveDic]) {
        const traduccion = DICCIONARIO_ES_PT[claveDic];
        localStorage.setItem(cacheKey, traduccion);
        mostrarResultado(traduccion, { origen: 'diccionario', direccion });
        loading.classList.add('hidden');
        boton.disabled = false;
        agregarAlHistorial(textoOriginal, traduccion);
        return;
    }

    // 3. Google Translate
    const langFrom = direccion === 'es-pt' ? 'es' : 'pt';
    const langTo   = direccion === 'es-pt' ? 'pt' : 'es';
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${langFrom}&tl=${langTo}&dt=t&q=${encodeURIComponent(textoOriginal)}`;

    try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error('No se pudo conectar con el servicio de traducción.');

        const datos = await respuesta.json();
        if (!datos || !datos[0]) throw new Error('No se encontró una traducción válida.');

        const traduccion = datos[0].map(s => s[0]).join('');
        localStorage.setItem(cacheKey, traduccion);
        mostrarResultado(traduccion, { origen: 'api', direccion });
        agregarAlHistorial(textoOriginal, traduccion);
    } catch (error) {
        console.error(error);
        mostrarToast('Error al traducir: ' + error.message, 'error');
        resultado.classList.remove('hidden');
        document.getElementById('traduccion').innerText = '⚠️ Error al traducir';
        document.getElementById('gramatica').innerHTML = `<p class="text-rose-600">${error.message}</p>`;
    } finally {
        loading.classList.add('hidden');
        boton.disabled = false;
    }
}

function mostrarResultado(traduccion, { origen, direccion }) {
    textoParaAudio = traduccion;
    document.getElementById('traduccion').innerText = traduccion;

    let gramaticaHTML = '';
    if (origen === 'caché') {
        gramaticaHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Análisis PT-PT (caché local):</strong>
            <p>Traducción recuperada instantáneamente sin consumir solicitudes adicionales.</p>
        `;
    } else if (origen === 'diccionario') {
        gramaticaHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Nota de Portugués de Portugal:</strong>
            <p>Término verificado específicamente para el uso cotidiano en Portugal (excluyendo variantes de Brasil).</p>
        `;
    } else if (direccion === 'es-pt') {
        gramaticaHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Particularidades del Portugués de Portugal:</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>Se utiliza la forma formal/informal según el contexto (distinción estricta entre <em>tu</em> y <em>você</em> / <em>o senhor</em>).</li>
                <li>Las vocales átonas suelen cerrarse notablemente en la pronunciación lusa.</li>
                <li>Presta atención al uso de las contracciones de preposiciones con artículos (ej. <em>em + o = no</em>).</li>
            </ul>
        `;
    } else {
        gramaticaHTML = `
            <strong class="text-emerald-900 block mb-1">💡 Análisis del texto en Portugués de Portugal:</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>Revisa la colocación de los pronombres átonos (clíticos), que en Portugal tienden a ir antes del verbo (proclisis) en más contextos que en Brasil.</li>
                <li>Verifica el vocabulario autóctono europeo frente al brasileño.</li>
            </ul>
        `;
    }

    document.getElementById('gramatica').innerHTML = gramaticaHTML;
    document.getElementById('resultado').classList.remove('hidden');
}

/* =========================================================
   AUDIO
   ========================================================= */
function reproducirAudio() {
    if (!textoParaAudio) {
        mostrarToast('Primero realiza una traducción.', 'aviso');
        return;
    }
    if (!('speechSynthesis' in window)) {
        mostrarToast('Tu navegador no soporta síntesis de voz.', 'error');
        return;
    }

    window.speechSynthesis.cancel();

    const velocidad = parseFloat(document.getElementById('velocidad').value);
    const estado = document.getElementById('estadoAudio');
    const mensaje = new SpeechSynthesisUtterance(textoParaAudio);

    mensaje.lang = IDIOMA_AUDIO;
    mensaje.rate = velocidad;
    mensaje.volume = 1;
    mensaje.pitch = 1;

    const voz = buscarVoz(IDIOMA_AUDIO);
    if (voz) {
        mensaje.voice = voz;
        const esPT = voz.lang.toLowerCase() === 'pt-pt';
        estado.innerText = esPT
            ? `🔊 Reproduciendo con voz lusa (${voz.name})`
            : `🔊 Reproduciendo con voz: ${voz.name} (${voz.lang}) — puede no ser PT-PT`;
    } else {
        estado.innerText = '🔊 Reproduciendo audio...';
    }

    mensaje.onend = () => { estado.innerText = '✓ Audio finalizado con éxito'; };
    mensaje.onerror = () => { estado.innerText = '⚠️ Error al reproducir audio'; };

    window.speechSynthesis.speak(mensaje);
}

function detenerAudio() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    const estado = document.getElementById('estadoAudio');
    if (estado) estado.innerText = 'Audio detenido';
}

/* =========================================================
   COPIAR
   ========================================================= */
async function copiarTraduccion(boton) {
    const texto = document.getElementById('traduccion').innerText;
    if (!texto) return;
    try {
        await navigator.clipboard.writeText(texto);
        const original = boton.innerHTML;
        boton.innerHTML = '✓ ¡Copiado!';
        boton.classList.add('text-emerald-800');
        setTimeout(() => {
            boton.innerHTML = original;
            boton.classList.remove('text-emerald-800');
        }, 1600);
    } catch {
        mostrarToast('No se pudo copiar al portapapeles.', 'error');
    }
}

/* =========================================================
   HISTORIAL (persistente)
   ========================================================= */
function cargarHistorial() {
    try {
        const data = JSON.parse(localStorage.getItem(HISTORIAL_KEY) || '[]');
        historial = Array.isArray(data) ? data : [];
    } catch {
        historial = [];
    }
    renderHistorial();
}

function guardarHistorial() {
    localStorage.setItem(HISTORIAL_KEY, JSON.stringify(historial.slice(0, MAX_HISTORIAL)));
}

function agregarAlHistorial(orig, trad) {
    // Evitar duplicados consecutivos
    historial = historial.filter(item => !(item.orig === orig && item.trad === trad));
    historial.unshift({ orig, trad, ts: Date.now() });
    if (historial.length > MAX_HISTORIAL) historial.pop();
    guardarHistorial();
    renderHistorial();
}

function renderHistorial() {
    const contenedor = document.getElementById('historialContainer');
    const lista = document.getElementById('listaHistorial');
    lista.innerHTML = '';

    if (!historial.length) {
        contenedor.classList.add('hidden');
        return;
    }
    contenedor.classList.remove('hidden');

    historial.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full text-left text-xs bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-300 p-2.5 rounded-xl flex justify-between items-center gap-2 transition';
        btn.innerHTML = `
            <span class="truncate max-w-[45%] font-medium">${escapeHtml(item.orig)}</span>
            <span class="text-slate-400 shrink-0">➔</span>
            <span class="truncate max-w-[45%] text-emerald-700 font-semibold text-right">${escapeHtml(item.trad)}</span>
        `;
        btn.addEventListener('click', () => {
            document.getElementById('texto').value = item.orig;
            actualizarContador();
            document.getElementById('texto').focus();
        });
        lista.appendChild(btn);
    });
}

function limpiarHistorial() {
    if (!historial.length) return;
    if (!confirm('¿Borrar todo el historial?')) return;
    historial = [];
    localStorage.removeItem(HISTORIAL_KEY);
    renderHistorial();
    mostrarToast('Historial borrado.', 'exito');
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

/* =========================================================
   RECONOCIMIENTO DE VOZ
   ========================================================= */
function iniciarVoz() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        mostrarToast('El reconocimiento de voz no está disponible. Usa Chrome o Edge.', 'aviso');
        return;
    }

    const reconocimiento = new SpeechRecognition();
    const direccion = document.getElementById('direccion').value;
    // pt-PT para Portugal; si el navegador no lo soporta, hacemos fallback a pt-BR / es-ES
    reconocimiento.lang = direccion === 'es-pt' ? 'es-ES' : 'pt-PT';
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    const boton = document.getElementById('btnMicrofono');
    const original = boton.innerHTML;
    boton.innerHTML = '🎙️ Escuchando...';
    boton.classList.add('bg-rose-100');

    const restaurar = () => {
        boton.innerHTML = original;
        boton.classList.remove('bg-rose-100');
    };

    reconocimiento.onresult = (event) => {
        document.getElementById('texto').value = event.results[0][0].transcript;
        actualizarContador();
        restaurar();
        mostrarToast('Texto dictado correctamente.', 'exito');
    };
    reconocimiento.onerror = (e) => {
        restaurar();
        mostrarToast('Error de reconocimiento: ' + (e.error || 'desconocido'), 'error');
    };
    reconocimiento.onend = restaurar;

    try {
        reconocimiento.start();
    } catch {
        restaurar();
        mostrarToast('No se pudo iniciar el reconocimiento.', 'error');
    }
}

/* =========================================================
   ATAJOS DE TECLADO
   ========================================================= */
document.getElementById('texto').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        traducir();
    }
});

/* =========================================================
   INICIALIZACIÓN
   ========================================================= */
actualizarContador();
cargarHistorial();
</script>

</body>
</html>
